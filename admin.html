<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversaciones — Café Coquí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="wrap">
    <h1>Conversaciones del chatbot</h1>
    <p class="subtitle">Café Coquí — historial de preguntas y respuestas</p>

    <div id="gate" class="gate">
      <label for="passwordInput" class="sr-only">Contraseña</label>
      <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" />
      <button id="enterBtn" type="button">Entrar</button>
      <p id="gateError" class="gate-error" hidden></p>
    </div>

    <div id="stats" class="stats" hidden>
      <div class="tiles">
        <div class="tile">
          <span class="tile-value" id="statTotal">0</span>
          <span class="tile-label">Conversaciones guardadas</span>
        </div>
        <div class="tile">
          <span class="tile-value" id="statToday">0</span>
          <span class="tile-label">Hoy</span>
        </div>
      </div>

      <section class="chart-block">
        <h2>Conversaciones por día <span class="chart-sub">(últimos 14 días)</span></h2>
        <div class="chart-scroll">
          <div class="bar-chart" id="dayChart"></div>
        </div>
      </section>

      <section class="chart-block">
        <h2>Hora del día más activa</h2>
        <div class="chart-scroll">
          <div class="bar-chart hour-chart" id="hourChart"></div>
        </div>
      </section>

      <section class="chart-block">
        <h2>Palabras más mencionadas</h2>
        <ul class="keyword-list" id="keywordList"></ul>
      </section>
    </div>

    <h2 class="list-heading" id="listHeading" hidden>Historial de conversaciones</h2>
    <div id="list" class="list" hidden></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
