<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustración de un café con leche">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="100%" stop-color="#1f2a1f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- steam -->
  <path d="M170 70 C160 55, 180 45, 170 30" stroke="#d98e04" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M200 75 C190 58, 212 48, 202 30" stroke="#d98e04" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M230 70 C220 55, 240 45, 230 30" stroke="#d98e04" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- saucer -->
  <ellipse cx="200" cy="225" rx="120" ry="18" fill="#12100a" opacity="0.35"/>

  <!-- cup body -->
  <path d="M110 110 H280 L268 205 C266 218, 254 226, 240 226 H150 C136 226, 124 218, 122 205 Z" fill="#f4efe3"/>

  <!-- coffee surface -->
  <ellipse cx="195" cy="112" rx="85" ry="14" fill="#7a4a1e"/>

  <!-- handle -->
  <path d="M280 130 C320 130, 320 190, 280 190" stroke="#f4efe3" stroke-width="14" fill="none" stroke-linecap="round"/>

  <text x="200" y="270" text-anchor="middle" font-family="Karla, sans-serif" font-size="15" fill="#9c8fc4">
    Foto de muestra — se reemplaza por la real
  </text>
</svg>
