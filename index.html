<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bola Mágica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🔮 Bola Mágica</h1>
    <p class="subtitle">Hazle una pregunta y descubre tu destino</p>

    <div class="ball" id="ball">
      <div class="ball-window" id="ballWindow">
        <span id="answer">?</span>
      </div>
    </div>

    <input type="text" id="question" placeholder="Escribe tu pregunta..." />
    <button id="askButton">Preguntar</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
